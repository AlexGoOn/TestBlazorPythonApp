name: Validate

on:
  pull_request:
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - "src/**"
      - "tests/**"
      - "azure.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AZURE_ENV_NAME: template-validation-dev
      AZURE_LOCATION: westus3
      AZURE_RESOURCE_GROUP: rg-template-validation-dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: Azure/setup-azd@v2
      - name: Compile Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem infra/hooks/*.ps1, scripts/*.ps1
          foreach ($file in $files) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref] $null, [ref] $parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Check role updater and postprovision hook without Azure access
        shell: pwsh
        run: |
          ./tests/test_subnet_role.ps1
          ./tests/test_postprovision.ps1
      - name: Check Python cloud startup
        run: |
          python -m pip install -r src/backend/requirements.txt
          export BICEP_COMPILED_TEMPLATE="$RUNNER_TEMP/main.json"
          cd tests
          python -m unittest test_cloud_runtime test_infrastructure -v
      - name: Package both services without deploying
        run: azd package --all --no-prompt --output-path "$RUNNER_TEMP/packages"
